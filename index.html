<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="timer-container">

        <h1>🍅 Pomodoro 🍅</h1>

        <div class="mode-buttons">
            <button style="font-weight: bold"; onclick="setMode('work')">Work</button>
            <button style="font-weight: bold"; onclick="setMode('short')">Short Break</button>
            <button style="font-weight: bold"; onclick="setMode('long')">Long Break</button>
        </div>

        <div id="timer">25:00</div>

        <div class="controls">
            <button onclick="startTimer()">Start</button>
            <button onclick="pauseTimer()">Pause</button>
            <button onclick="resetTimer()">Reset</button>
        </div>

        <p>Sessions completed: <span id="sessions">0</span></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
